<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070c17" />
<title>مجید نداف کرمانی | متخصص زیرساخت شبکه، مجازی‌سازی و امنیت</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  font-family:Vazirmatn,Tahoma,sans-serif;
  color-scheme:dark;
  --bg:#070c17; --bg2:#0b1220; --panel:#0f1829; --panel2:#141f33;
  --line:rgba(179,195,220,.1);
  --text:#eef3fb; --muted:#8b9ab1;
  --gold:#d9ad65; --gold2:#f5d99c; --gold3:#c89040;
  --cyan:#4ad9d9; --green:#4ade80; --purple:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;scroll-behavior:smooth}
body{background:var(--bg);font-family:inherit;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.7;font-size:15px}
button{font-family:inherit;cursor:pointer;border:0}
a{text-decoration:none;color:inherit}

.site{min-height:100vh;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(217,173,101,.15),transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 40%,rgba(74,217,217,.08),transparent 60%),
    radial-gradient(ellipse 60% 40% at 0% 80%,rgba(167,139,250,.08),transparent 60%),
    var(--bg);
}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.3;z-index:1;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:.4}
.orb1{width:500px;height:500px;background:#d9ad65;top:-200px;right:-100px;animation:orb1 25s infinite alternate}
.orb2{width:400px;height:400px;background:#4ad9d9;bottom:-150px;left:-100px;animation:orb2 30s infinite alternate}
@keyframes orb1{to{transform:translate(-100px,100px) scale(1.2)}}
@keyframes orb2{to{transform:translate(100px,-80px) scale(1.3)}}

.particles{position:fixed;inset:0;pointer-events:none;z-index:1}
.particle{position:absolute;width:2px;height:2px;background:var(--gold2);border-radius:50%;box-shadow:0 0 6px var(--gold);animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(50px);opacity:0}}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;transition:.35s;border-bottom:1px solid transparent}
.nav.scrolled{background:rgba(7,12,23,.75);backdrop-filter:blur(20px) saturate(150%);border-bottom-color:var(--line);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.nav-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 28px}
.brand{display:flex;align-items:center;gap:13px;cursor:pointer;transition:.2s}
.brand:hover{transform:translateY(-1px)}
.brand-mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold2),var(--gold),var(--gold3));
  color:#0a0e1a;font-weight:900;font-size:15px;letter-spacing:.5px;
  box-shadow:0 0 30px rgba(217,173,101,.4),inset 0 1px 0 rgba(255,255,255,.3);
  position:relative;overflow:hidden;border:2px solid rgba(245,217,156,.6);
}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-mark.sm{width:42px;height:42px;font-size:13px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.2px}
.brand small{display:block;font-size:9.5px;letter-spacing:2px;color:var(--gold2);margin-top:3px;font-weight:500}

.nav-links{display:flex;align-items:center;gap:2px}
.nav-links button{background:none;color:#a8b4c8;font-size:13px;padding:10px 13px;border-radius:10px;transition:.2s;font-weight:500;position:relative}
.nav-links button:not(.nav-cta):hover{color:var(--gold2);background:rgba(217,173,101,.08)}
.nav-links button:not(.nav-cta):after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--gold);transition:.2s;border-radius:2px}
.nav-links button:not(.nav-cta):hover:after{width:20px}

.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:11px;
  background:linear-gradient(135deg,var(--gold2),var(--gold),var(--gold3));
  color:#0a0e1a;font-weight:700;font-size:13.5px;transition:.25s;position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(217,173,101,.35),inset 0 1px 0 rgba(255,255,255,.4);
}
.btn-primary:before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transition:.6s}
.btn-primary:hover:before{left:100%}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(217,173,101,.5)}
.btn-primary.full{width:100%}
.nav-cta{margin-right:10px;padding:11px 20px;font-size:13px}

.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:11px;
  background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line);font-weight:600;font-size:13.5px;transition:.2s;
}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(217,173,101,.5);transform:translateY(-2px)}

.menu-btn{display:none;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);border-radius:10px;width:42px;height:42px;place-items:center}

/* HERO */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:120px 28px 80px;overflow:hidden;z-index:2}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(217,173,101,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(217,173,101,.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,black,transparent);pointer-events:none}
.hero-inner{max-width:1280px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;position:relative;z-index:2}

.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--gold2);
  border:1px solid rgba(217,173,101,.3);background:rgba(217,173,101,.08);
  padding:9px 18px;border-radius:30px;margin-bottom:28px;font-weight:500;backdrop-filter:blur(10px);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.5;transform:scale(1.3)}}

.hero-text h1{font-size:clamp(32px,4.4vw,56px);line-height:1.45;margin:0 0 24px;font-weight:800;letter-spacing:-1px}
.gradient-text{
  background:linear-gradient(120deg,var(--gold2),var(--gold),var(--cyan),var(--gold2));
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:gradientMove 6s linear infinite;
  display:inline;
}
@keyframes gradientMove{to{background-position:300% center}}

.typed-wrap{display:inline-block;min-height:1em}
.typed{color:var(--gold);font-weight:700}
.cursor{animation:blink 1s step-end infinite;color:var(--gold2);font-weight:300;margin-left:2px}
@keyframes blink{50%{opacity:0}}

.hero-text p{font-size:16px;line-height:2.1;color:#b8c4d8;max-width:600px;margin:0 0 34px}
.hero-text p b{color:var(--gold2);font-weight:600}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:40px}

/* HERO STATS MINI */
.hero-stats-mini{display:flex;gap:32px;padding-top:30px;border-top:1px solid var(--line);flex-wrap:wrap}
.hsm{text-align:right}
.hsm b{display:block;font-size:32px;font-weight:800;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;
  font-feature-settings:"tnum";
}
.hsm small{display:block;font-size:13px;color:var(--muted);margin-top:8px}

/* HERO ART */
.hero-art{position:relative;height:560px;display:grid;place-items:center}
.orbit-container{position:absolute;width:100%;height:100%;display:grid;place-items:center}
.orbit{position:absolute;border-radius:50%;border:1px solid rgba(217,173,101,.15)}
.orbit.o1{width:220px;height:220px;animation:spin 20s linear infinite}
.orbit.o2{width:340px;height:340px;border-color:rgba(74,217,217,.12);animation:spin 30s linear infinite reverse}
.orbit.o3{width:460px;height:460px;border-color:rgba(217,173,101,.08);animation:spin 45s linear infinite}
.orbit.o4{width:540px;height:540px;border-color:rgba(167,139,250,.06);animation:spin 60s linear infinite reverse}
.orbit.o1:before{content:'';position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--gold2);box-shadow:0 0 15px var(--gold2)}
.orbit.o2:before{content:'';position:absolute;top:-3px;left:50%;width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.orbit.o3:before{content:'';position:absolute;top:-3px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--purple);box-shadow:0 0 10px var(--purple)}
.orbit.o4:before{content:'';position:absolute;top:-2px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}

.hero-avatar-wrap{position:relative;z-index:3}
.hero-avatar{width:230px;height:230px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 30% 30%,#1f3050,#0a1222);
  border:2px solid rgba(217,173,101,.6);
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 80px rgba(217,173,101,.35),inset 0 0 60px rgba(217,173,101,.1),0 20px 60px rgba(0,0,0,.6);
  animation:avatarGlow 3s ease-in-out infinite;
}
@keyframes avatarGlow{
  0%,100%{box-shadow:0 0 80px rgba(217,173,101,.35),inset 0 0 60px rgba(217,173,101,.1),0 20px 60px rgba(0,0,0,.6)}
  50%{box-shadow:0 0 100px rgba(217,173,101,.55),inset 0 0 60px rgba(217,173,101,.15),0 20px 60px rgba(0,0,0,.6)}
}
.hero-avatar:before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),transparent 25%,var(--cyan),transparent 50%,var(--gold),transparent 75%,var(--purple));opacity:.7;z-index:-1;animation:spin 8s linear infinite}
.hero-avatar img{
  width:100%;height:100%;object-fit:cover;border-radius:50%;
}
.avatar-inner{font-size:78px;font-weight:900;letter-spacing:-3px;
  background:linear-gradient(135deg,var(--gold2),var(--gold),#fff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(217,173,101,.5));
}
.avatar-badge{position:absolute;bottom:14px;right:14px;background:linear-gradient(135deg,var(--green),#22c55e);color:#052e16;font-weight:800;font-size:11px;padding:6px 14px;border-radius:20px;border:2px solid var(--bg);box-shadow:0 0 15px rgba(74,222,128,.6);z-index:5;animation:pulse 2s infinite}

/* FLOAT CARDS */
.float-card{position:absolute;background:rgba(15,24,41,.9);backdrop-filter:blur(15px) saturate(180%);
  border:1px solid rgba(217,173,101,.28);border-radius:14px;padding:12px 16px;
  display:flex;flex-direction:column;gap:4px;z-index:4;
  box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  animation:floatCard 5s ease-in-out infinite;cursor:default;
  transition:.3s;
}
.float-card:hover{border-color:rgba(217,173,101,.6);transform:scale(1.05);box-shadow:0 15px 50px rgba(0,0,0,.7),0 0 30px rgba(217,173,101,.3)}
.float-card svg{color:var(--gold2)}
.float-card b{font-size:12px;color:var(--text);font-weight:600;white-space:nowrap}
.float-card small{font-size:9.5px;color:var(--muted);letter-spacing:.3px;white-space:nowrap}

.fc1{top:-10px;right:-40px;animation-delay:0s}
.fc2{top:90px;left:-60px;animation-delay:.8s}
.fc3{bottom:140px;right:-60px;animation-delay:1.6s}
.fc4{bottom:50px;left:-45px;animation-delay:2.4s}
.fc5{top:-30px;left:30px;animation-delay:3.2s}
.fc6{bottom:-20px;right:20px;animation-delay:4s}
.fc7{top:50%;right:-80px;transform:translateY(-50%);animation-delay:1.2s}
.fc8{top:50%;left:-75px;transform:translateY(-50%);animation-delay:2.8s}

@keyframes floatCard{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}
.fc7{animation:floatCardH 6s ease-in-out infinite;animation-delay:1.2s}
.fc8{animation:floatCardH 6s ease-in-out infinite;animation-delay:2.8s}
@keyframes floatCardH{
  0%,100%{transform:translateY(-50%)}
  50%{transform:translateY(calc(-50% - 14px))}
}

.scroll-hint{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);color:var(--muted);z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;letter-spacing:2px}
.scroll-hint svg{animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* SECTIONS */
.section{max-width:1280px;margin:0 auto;padding:100px 28px;position:relative;z-index:2}
.section-head{text-align:center;margin-bottom:60px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gold);font-weight:600;letter-spacing:1.5px;
  background:rgba(217,173,101,.08);border:1px solid rgba(217,173,101,.3);
  padding:8px 18px;border-radius:30px;margin-bottom:18px;text-transform:uppercase;
}
.section-head h2{font-size:clamp(28px,3.8vw,44px);margin:0 0 16px;font-weight:800;letter-spacing:-.8px;line-height:1.3}
.section-head h2 span{color:var(--gold2)}
.section-head p{font-size:15px;color:var(--muted);margin:0;max-width:620px;margin-left:auto;margin-right:auto;line-height:1.9}

/* STATS STRIP */
.stats-strip{max-width:1280px;margin:-30px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 28px 60px;position:relative;z-index:3}
.stat-box{background:linear-gradient(145deg,rgba(20,31,51,.8),rgba(15,24,41,.6));backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:16px;padding:24px 22px;
  display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;transition:.3s;
}
.stat-box:hover{border-color:rgba(217,173,101,.4);transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.stat-box:before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:.3s}
.stat-box:hover:before{opacity:1}
.stat-icon{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(217,173,101,.15),rgba(217,173,101,.05));
  border:1px solid rgba(217,173,101,.25);color:var(--gold2);flex-shrink:0;
}
.stat-box b{display:block;font-size:30px;color:var(--text);font-weight:800;letter-spacing:-1px;line-height:1}
.stat-box small{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:start}
.about-text p{font-size:15px;line-height:2.1;color:#c5cfdd;margin:0 0 20px}
.about-text p b{color:var(--gold2);font-weight:600}
.about-text .quote{padding:20px 24px;background:rgba(217,173,101,.05);border-right:3px solid var(--gold);border-radius:0 12px 12px 0;font-style:italic;color:#d5dee9;font-size:14px;margin:26px 0;line-height:2}
.about-highlights{margin:30px 0;display:grid;gap:12px}
.about-highlights>div{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:#d5dee9;padding:13px 16px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;transition:.2s}
.about-highlights>div:hover{background:rgba(217,173,101,.05);border-color:rgba(217,173,101,.3);transform:translateX(-4px)}
.about-highlights svg{color:var(--green);flex-shrink:0;margin-top:3px}
.about-contact{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.about-contact a{display:flex;align-items:center;gap:8px;font-size:13px;color:#c5cfdd;padding:11px 18px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;transition:.2s}
.about-contact a:hover{color:var(--gold2);border-color:rgba(217,173,101,.4);background:rgba(217,173,101,.05);transform:translateY(-2px)}
.about-contact svg{color:var(--gold)}

.about-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.about-card{background:linear-gradient(145deg,rgba(20,31,51,.7),rgba(15,24,41,.5));backdrop-filter:blur(15px);
  border:1px solid var(--line);border-radius:16px;padding:26px 22px;transition:.35s;position:relative;overflow:hidden;
}
.about-card:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(217,173,101,.1),transparent 60%);opacity:0;transition:.35s}
.about-card:hover{border-color:rgba(217,173,101,.4);transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.about-card:hover:before{opacity:1}
.about-card>svg{color:var(--gold2);margin-bottom:14px;position:relative}
.about-card b{display:block;font-size:14.5px;margin-bottom:8px;position:relative}
.about-card p{font-size:12.5px;color:var(--muted);line-height:1.9;margin:0;position:relative}

/* SERVICES */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.service-card{background:linear-gradient(145deg,rgba(20,31,51,.8),rgba(15,24,41,.6));backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:20px;padding:32px 26px;transition:.4s;position:relative;overflow:hidden;
}
.service-card:before{content:'';position:absolute;top:0;right:0;width:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--cyan));transition:.5s}
.service-card:hover{border-color:rgba(217,173,101,.4);box-shadow:0 30px 60px rgba(0,0,0,.4)}
.service-card:hover:before{width:100%}
.service-icon{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(217,173,101,.2),rgba(217,173,101,.05));
  border:1px solid rgba(217,173,101,.3);color:var(--gold2);margin-bottom:22px;transition:.3s;
}
.service-card:hover .service-icon{transform:scale(1.1) rotate(-5deg);background:linear-gradient(135deg,rgba(217,173,101,.3),rgba(217,173,101,.1))}
.service-card h3{font-size:16.5px;margin:0 0 12px;font-weight:700}
.service-card p{font-size:13.5px;line-height:2;color:#a8b4c8;margin:0 0 18px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:10.5px;color:var(--gold2);background:rgba(217,173,101,.1);border:1px solid rgba(217,173,101,.2);padding:5px 11px;border-radius:20px;font-weight:500}

/* SKILLS */
.skills-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;max-width:1100px;margin:0 auto}
.skill-circle{background:linear-gradient(145deg,rgba(20,31,51,.8),rgba(15,24,41,.6));backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:22px;padding:34px 24px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;
  transition:.4s;position:relative;overflow:hidden;cursor:default;
}
.skill-circle:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(217,173,101,.1),transparent 70%);opacity:0;transition:.4s}
.skill-circle:hover{border-color:rgba(217,173,101,.5);transform:translateY(-8px) scale(1.02);box-shadow:0 30px 60px rgba(0,0,0,.4),0 0 40px rgba(217,173,101,.15)}
.skill-circle:hover:before{opacity:1}
.skill-icon-wrap{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle,rgba(217,173,101,.15),transparent 70%);
  border:1px solid rgba(217,173,101,.35);
  transition:.4s;
}
.skill-icon-wrap:before{content:'';position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--gold),var(--gold2),var(--cyan),var(--gold));
  opacity:.6;filter:blur(6px);z-index:-1;
  animation:spinGlow 4s linear infinite;
}
@keyframes spinGlow{to{transform:rotate(360deg)}}
.skill-icon-wrap svg{color:var(--gold2);width:38px;height:38px;transition:.3s}
.skill-circle:hover .skill-icon-wrap svg{transform:scale(1.15) rotate(-5deg)}
.skill-circle h4{font-size:15px;font-weight:700;margin:0;color:var(--text);line-height:1.5}
.skill-circle p{font-size:12px;color:var(--muted);margin:0;line-height:1.8}
.skill-level-dots{display:flex;gap:5px;margin-top:6px}
.skill-level-dots i{width:7px;height:7px;border-radius:50%;background:rgba(217,173,101,.15);border:1px solid rgba(217,173,101,.3);transition:.3s}
.skill-circle:hover .skill-level-dots i{background:var(--gold2);box-shadow:0 0 8px var(--gold2)}

.tech-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:50px}
.tech-chips span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#c5cfdd;
  background:rgba(255,255,255,.04);border:1px solid var(--line);padding:10px 18px;border-radius:12px;transition:.25s;font-weight:500;
}
.tech-chips span:hover{border-color:rgba(217,173,101,.5);color:var(--gold2);background:rgba(217,173,101,.08);transform:translateY(-3px);box-shadow:0 8px 20px rgba(217,173,101,.15)}
.tech-chips svg{color:var(--gold)}

/* EXPERIENCE */
.timeline{position:relative;max-width:920px;margin:0 auto;padding-right:30px}
.timeline:before{content:'';position:absolute;right:8px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,var(--gold),rgba(217,173,101,.1));border-radius:2px}
.timeline-item{position:relative;margin-bottom:34px;padding-right:44px}
.timeline-dot{position:absolute;right:-4px;top:6px;width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid rgba(217,173,101,.5);
  display:grid;place-items:center;color:var(--gold2);z-index:2;
  box-shadow:0 0 20px rgba(217,173,101,.3),0 4px 15px rgba(0,0,0,.3);
}
.timeline-card{background:linear-gradient(145deg,rgba(20,31,51,.8),rgba(15,24,41,.6));backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:18px;padding:26px 28px;transition:.3s;
}
.timeline-card:hover{border-color:rgba(217,173,101,.4);transform:translateX(-6px);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.timeline-year{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gold2);font-weight:600;
  background:rgba(217,173,101,.1);border:1px solid rgba(217,173,101,.25);padding:6px 14px;border-radius:20px;margin-bottom:12px;
}
.timeline-card h3{font-size:17px;margin:0 0 8px;font-weight:700}
.timeline-card .company{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);font-weight:500;margin-bottom:12px}
.timeline-card .company:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold)}
.timeline-card p{font-size:13.5px;line-height:2;color:#a8b4c8;margin:0}

/* CERTS */
.certs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:40px}
.cert-card{background:linear-gradient(145deg,rgba(20,31,51,.8),rgba(15,24,41,.6));backdrop-filter:blur(15px);
  border:1px solid var(--line);border-radius:14px;padding:22px 20px;transition:.3s;
  display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;
}
.cert-card:before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--gold),var(--cyan));transform:scaleX(0);transform-origin:right;transition:.4s}
.cert-card:hover{border-color:rgba(217,173,101,.4);transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.cert-card:hover:before{transform:scaleX(1)}
.cert-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(217,173,101,.15),rgba(217,173,101,.05));
  border:1px solid rgba(217,173,101,.3);color:var(--gold2);flex-shrink:0;
}
.cert-card div:last-child b{display:block;font-size:13.5px;font-weight:700;color:var(--text)}
.cert-card div:last-child small{display:block;font-size:11px;color:var(--muted);margin-top:3px}

/* COURSES */
.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.course-card{background:linear-gradient(145deg,rgba(20,31,51,.8),rgba(15,24,41,.6));backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:16px;padding:26px;transition:.3s;position:relative;overflow:hidden;
}
.course-card:before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:linear-gradient(180deg,var(--gold),var(--cyan));opacity:0;transition:.3s}
.course-card:hover{border-color:rgba(217,173,101,.4);transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.course-card:hover:before{opacity:1}
.course-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--gold2);font-weight:600;
  background:rgba(217,173,101,.1);border:1px solid rgba(217,173,101,.25);padding:5px 12px;border-radius:20px;margin-bottom:14px;
}
.course-card h3{font-size:15.5px;margin:0 0 10px;font-weight:700}
.course-card p{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.8}
.course-meta{display:flex;gap:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.course-meta span{display:inline-flex;align-items:center;gap:5px}
.course-meta svg{color:var(--gold);width:14px;height:14px}

/* TESTIMONIALS */
.testi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.testi-card{background:linear-gradient(145deg,rgba(20,31,51,.8),rgba(15,24,41,.6));backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:20px;padding:30px 26px;transition:.3s;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.testi-card:before{content:'"';position:absolute;top:10px;right:24px;font-size:90px;color:rgba(217,173,101,.08);font-family:Georgia,serif;line-height:1;pointer-events:none}
.testi-card:hover{border-color:rgba(217,173,101,.4);transform:translateY(-6px);box-shadow:0 25px 50px rgba(0,0,0,.3)}
.stars{display:flex;gap:3px;margin-bottom:16px;position:relative}
.testi-card p{font-size:14px;line-height:2.05;color:#c5cfdd;margin:0 0 22px;flex:1;position:relative;z-index:1}
.testi-author{display:flex;align-items:center;gap:12px;padding-top:20px;border-top:1px solid var(--line);position:relative}
.testi-avatar{width:50px;height:50px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#0a0e1a;
  display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(217,173,101,.3);flex-shrink:0;
}
.testi-author b{display:block;font-size:14px;font-weight:700}
.testi-author small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}

/* FAQ */
.faq-list{max-width:840px;margin:0 auto;display:grid;gap:12px}
.faq-item{background:rgba(15,24,41,.6);backdrop-filter:blur(15px);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.3s;cursor:pointer}
.faq-item.open{border-color:rgba(217,173,101,.4);background:linear-gradient(145deg,rgba(20,31,51,.8),rgba(15,24,41,.6))}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;gap:16px}
.faq-q span{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600}
.faq-q span svg{color:var(--gold2);flex-shrink:0}
.faq-q .chev{color:var(--muted);transition:.35s;flex-shrink:0}
.faq-item.open .chev{transform:rotate(180deg);color:var(--gold2)}
.faq-a{max-height:0;overflow:hidden;transition:.35s;font-size:13.5px;line-height:2.1;color:#a8b4c8;padding:0 24px}
.faq-item.open .faq-a{max-height:250px;padding:0 24px 24px}

/* CONTACT - کارت‌های تماس */
.contact-hero{
  background:linear-gradient(145deg,rgba(20,31,51,.9),rgba(11,18,32,.95));
  border:1px solid rgba(217,173,101,.25);
  border-radius:28px;padding:60px 50px;position:relative;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.5);
  text-align:center;
}
.contact-hero:before{
  content:'';position:absolute;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,173,101,.15),transparent 70%);
  left:-200px;bottom:-200px;pointer-events:none;
}
.contact-hero:after{
  content:'';position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(74,217,217,.1),transparent 70%);
  right:-150px;top:-150px;pointer-events:none;
}
.contact-hero .eyebrow{margin-bottom:18px}
.contact-hero h2{font-size:clamp(28px,3.5vw,42px);margin:0 0 45px;line-height:1.4;font-weight:800}
.contact-hero h2 span{color:var(--gold2)}

.contact-methods{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  position:relative;
  z-index:2;
}
.contact-method{
  display:flex;align-items:center;gap:16px;
  padding:22px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  border-radius:16px;
  transition:.3s;
  position:relative;
  overflow:hidden;
  text-align:right;
}
.contact-method:before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(217,173,101,.08),transparent);
  opacity:0;transition:.3s;
}
.contact-method:hover{
  border-color:rgba(217,173,101,.5);
  transform:translateY(-4px);
  box-shadow:0 20px 40px rgba(0,0,0,.3),0 0 30px rgba(217,173,101,.15);
}
.contact-method:hover:before{opacity:1}
.cm-icon{
  width:56px;height:56px;border-radius:14px;
  display:grid;place-items:center;color:#fff;
  flex-shrink:0;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
  position:relative;z-index:1;
}
.cm-body{flex:1;position:relative;z-index:1;min-width:0}
.cm-body small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.cm-body b{display:block;font-size:14.5px;color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-body p{font-size:11.5px;color:var(--muted);margin:5px 0 0;line-height:1.5}
.cm-arrow{
  color:var(--muted);
  flex-shrink:0;
  transition:.3s;
  position:relative;z-index:1;
}
.contact-method:hover .cm-arrow{
  color:var(--gold2);
  transform:translate(-4px,-4px);
}

/* FOOTER */
.footer{position:relative;border-top:1px solid var(--line);background:rgba(5,9,17,.95);margin-top:60px;overflow:hidden;z-index:2}
.footer-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:44px 28px;gap:28px;flex-wrap:wrap}
.footer-brand{display:flex;align-items:center;gap:13px}
.footer-brand b{display:block;font-size:15px;font-weight:700}
.footer-brand small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.footer-links{display:flex;gap:4px;flex-wrap:wrap}
.footer-links button{background:none;color:var(--muted);font-size:12.5px;padding:8px 12px;border-radius:9px;transition:.2s;font-weight:500}
.footer-links button:hover{color:var(--gold2);background:rgba(217,173,101,.08)}
.footer-social{display:flex;gap:10px}
.footer-social a{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:.25s;background:rgba(255,255,255,.03)}
.footer-social a:hover{color:var(--gold2);border-color:rgba(217,173,101,.5);background:rgba(217,173,101,.08);transform:translateY(-3px)}
.footer-bottom{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;padding:20px 28px;border-top:1px solid var(--line);font-size:12px;color:#6b7a90;flex-wrap:wrap;gap:10px}
.footer-bottom b{color:var(--gold2);font-weight:600}
.footer-shine{position:absolute;top:-1px;left:-35%;width:28%;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),#fff,var(--gold),transparent);filter:drop-shadow(0 0 8px var(--gold2));animation:shine 8s linear infinite}
@keyframes shine{0%{left:-35%}100%{left:110%}}

/* Reveal */
.reveal{opacity:0;transform:translateY(30px);transition:.8s cubic-bezier(.4,0,.2,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* RESPONSIVE */
@media(max-width:1100px){
  .hero-inner{grid-template-columns:1fr;text-align:center;gap:30px}
  .hero-text p{margin-left:auto;margin-right:auto}
  .hero-actions,.hero-stats-mini{justify-content:center;text-align:center}
  .hero-art{height:520px;margin-top:30px}
  .orbit.o1{width:180px;height:180px}.orbit.o2{width:280px;height:280px}.orbit.o3{width:380px;height:380px}.orbit.o4{width:460px;height:460px}
  .hero-avatar{width:190px;height:190px}.avatar-inner{font-size:62px}
  .services-grid,.testi-grid{grid-template-columns:1fr 1fr}
  .about-grid{grid-template-columns:1fr;gap:40px}
  .fc1{right:0}.fc2{left:0}.fc3{right:0}.fc4{left:0}.fc5{left:0}.fc6{right:0}.fc7{right:-20px}.fc8{left:-20px}
  .contact-methods{grid-template-columns:repeat(2,1fr)}
  .contact-hero{padding:45px 30px}
}
@media(max-width:768px){
  .nav-links{position:fixed;top:80px;right:16px;left:16px;flex-direction:column;align-items:stretch;background:rgba(10,17,29,.98);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;padding:14px;gap:4px;display:none;box-shadow:0 25px 60px rgba(0,0,0,.5)}
  .nav-links.open{display:flex}
  .nav-links button{text-align:right;padding:14px 16px;font-size:14px}
  .nav-cta{margin:8px 0 0;justify-content:center}
  .menu-btn{display:grid}
  .stats-strip{grid-template-columns:1fr 1fr;padding:0 16px 40px;margin-top:0}
  .section{padding:70px 16px}
  .services-grid,.testi-grid{grid-template-columns:1fr}
  .about-cards{grid-template-columns:1fr 1fr}
  .hero{padding:110px 16px 60px}
  .hero-art{height:460px}
  .float-card{padding:8px 12px}
  .float-card small{display:none}
  .footer-inner{justify-content:center;text-align:center;padding:32px 16px}
  .footer-links{justify-content:center}
  .footer-bottom{flex-direction:column;text-align:center;gap:8px;padding:18px 16px}
  .skills-wrap{grid-template-columns:1fr 1fr;gap:12px}
  .skill-circle{padding:22px 14px}
  .skill-icon-wrap{width:70px;height:70px}
  .skill-icon-wrap svg{width:30px;height:30px}
  .fc1,.fc2,.fc3,.fc4,.fc5,.fc6,.fc7,.fc8{display:none}
  .contact-methods{grid-template-columns:1fr}
  .contact-hero{padding:36px 20px}
  .cm-body b{font-size:13px}
}
@media(max-width:480px){
  .stats-strip{grid-template-columns:1fr}
  .about-cards{grid-template-columns:1fr}
  .skills-wrap{grid-template-columns:1fr}
  .hero-art{height:400px}
  .hero-text h1{font-size:26px}
  .hero-stats-mini{gap:16px;flex-direction:column;align-items:center}
  .certs-grid{grid-template-columns:1fr}
  .courses-grid{grid-template-columns:1fr}
}

/* اصلاح یکپارچه تایپوگرافی فارسی و چیدمان واکنش‌گرا */
html { text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
body { overflow-wrap: break-word; }
.hero-inner > *, .about-grid > *, .services-grid > *,
.contact-methods > *, .grid > * { min-width: 0; }

/* تراز دوطرفه فقط برای متن‌های توضیحی؛ نه عنوان‌ها و دکمه‌ها */
.hero-text p, .about-text p, .about-text .quote,
.section-head p, .about-card p, .service-card p,
.skill-circle p, .timeline-card p, .course-card p,
.testi-card p, .faq-a, .contact-method .cm-body p {
  text-align: justify;
  text-align-last: right;
  text-justify: inter-word;
  text-wrap: pretty;
  direction: rtl;
  overflow-wrap: break-word;
  word-break: normal;
  hyphens: none;
}

/* بهبود خوانایی، جلوگیری از تک‌واژه در خط پایانی و فواصل نامتناسب */
.hero-text p, .about-text p, .about-text .quote {
  line-height: 2.05;
}
.section-head p { margin-inline: auto; }
.hero-text p { max-width: 650px; }

/* عنوان‌ها بهتر است دوطرفه نشوند */
h1, h2, h3, h4, .badge, .nav-links, .hero-stats-mini,
.stat-box, .tags, .course-meta, .footer-bottom {
  text-align: start;
}
.section-head h2, .section-head .eyebrow,
.contact-hero h2, .contact-hero .eyebrow { text-align: center; }

/* در صفحه‌های باریک، متن‌های کوتاه کشیده و نامنظم نشوند */
@media (max-width: 600px) {
  .hero-text p, .about-text p, .about-text .quote,
  .section-head p, .about-card p, .service-card p,
  .skill-circle p, .timeline-card p, .course-card p,
  .testi-card p, .faq-a, .contact-method .cm-body p {
    text-align: right;
    text-wrap: pretty;
  }
  .hero-inner, .about-grid { min-width: 0; }
  .hero-text p { max-width: 100%; }
}
